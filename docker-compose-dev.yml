name: fullstack-docker
services:
    db:
        networks:
            - backend
        restart: unless-stopped
        volumes:
            - pgdata:/var/lib/postgresql/data
        ports:
            - 5432:5432
        environment:
            - POSTGRES_PASSWORD=os_1234567
        image: postgres:15.1-alpine
    react-frontend:
        init: true
        build:
          context: ./clock/.
          target: build-dev
        container_name: react-frontend
        networks:
            - frontend
        environment:
            - PORT=5173
        ports:
            - 5173:5173
        links:
            - node-server
            - go-server
        restart: unless-stopped
        image: react-frontend:v0.1
        volumes:
            - type: bind
              source: ./clock/. 
              target: /app/.
            - type: volume
              target: /app/node_modules
        depends_on: 
            - node-server
            - go-server
    node-server:
        init: true
        build:
          context: ./node-api/.
          target: dev
        container_name: node-server
        networks:
            - backend
        environment:
            - DB_URI=postgresql://postgres:os_1234567@db:5432/postgres
            - PORT=3000
        ports:
            - 3000:3000
        links:
            - db
        restart: unless-stopped
        image: node-api:v0.1
        depends_on: 
            - db
        volumes:
            - type: bind
              source: ./node-api/.
              target: /app/.
            - type: volume
              target: /app/node_modules
    go-server:
        init: true
        build:
          context: ./go-api/.
          dockerfile: Dockerfile
          target: dev
        container_name: go-server
        networks:
            - backend
        environment:
            - DB_URI=postgresql://postgres:os_1234567@db:5432/postgres
            - PORT=8080
        ports:
            - 8080:8080
        links:
            - db
        restart: unless-stopped
        image: go-api:v0.1
        depends_on: 
            - db
        volumes:
            - type: bind
              source: ./go-api/.
              target: /app/.
networks:
    backend:
    frontend:
volumes:
    pgdata:
